  .actions{display:flex;align-items:center;gap:10px}
  .btn{border:1px solid var(--line);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 15px;min-height:43px;background:transparent;color:#51604f;font-size:12px;white-space:nowrap;cursor:pointer;transition:background .15s,transform .15s,border-color .15s}

  .btn:hover{background:#ececde;border-color:#c2c5b3}

            <g id="kingFacing" transform="scale(-1 1)"><g id="kingBob" class="ink">
              <path id="kingCape" d="M-15-118C-42-112-52-91-84-99Q-70-57-26-45L3-83Z" fill="#923c32"/>
              <path id="kingCapeTrim" d="M-80-96Q-66-61-28-50" fill="none" stroke="#c6a164" stroke-width="3"/>
              <path id="kingBackArm" d="M-12-108Q-31-91-42-100" fill="none" stroke="#993f32" stroke-width="18"/>
              <circle id="kingBackHand" cx="-42" cy="-100" r="5.6" fill="#e7c598"/>
              <path id="kingLegBack" d="M-10-48Q-22-22-25-5" fill="none" stroke="#6b3f34" stroke-width="12"/>
              <path id="kingBootBack" d="M-6-5q7-3 12 1l12 5q4 5-4 5H-7Z" fill="#34443a" transform="translate(-25 -5)"/>
              <path id="kingLegFront" d="M8-48Q22-25 24-5" fill="none" stroke="#7b4938" stroke-width="12"/>
              <path id="kingBootFront" d="M-6-5q7-3 12 1l12 5q4 5-4 5H-7Z" fill="#34443a" transform="translate(24 -5)"/>
              <g id="kingSkirt"><path d="M-21-83h41l19 42q-34 14-73-1Z" fill="#b3513b"/><path d="M-8-80l-8 37M9-81l14 38" fill="none" stroke="#90392f" stroke-width="2.4"/><path d="M-31-44q33 11 66 1" fill="none" stroke="#d0ad68" stroke-width="5"/><path d="M-1-73l1 32" fill="none" stroke="#d3a762" stroke-width="2"/></g>
              <path d="M-12-119l-14 17 7 29q23 9 40-2l2-29-13-15Z" fill="#b04b37"/>
              <path d="M-13-117L5-91l8-26M5-91L-3-76" fill="none" stroke="#d7ae67" stroke-width="5"/>
              <path d="M-22-81q22 6 44-1v9q-22 8-44 0Z" fill="#354a3c"/>
              <rect x="-3" y="-82" width="11" height="11" rx="2" fill="#c5a163" stroke="#d5b879" stroke-width="1.5"/>
              <g id="kingSword" transform="translate(-26 -78) rotate(24)">
                <g id="kingBlade"><path d="M-3-1V64l3 9 3-9V-1Z" fill="#d8e2d8" stroke="#7f9183" stroke-width="1.4"/><rect x="-3.5" y="-25" width="7" height="24" rx="2" fill="#c6a162"/><path d="M-3-20h6m-6 6h6m-6 6h6" stroke="#89703e" stroke-width="1.4"/><path d="M-11-2h22" stroke="#d9b875" stroke-width="4" stroke-linecap="round"/><circle cx="0" cy="-26" r="4" fill="#c6a162"/></g>
                <path d="M-5 2H5v65L0 76l-5-9Z" fill="#334d42" stroke="#284035" stroke-width="2"/>
                <path d="M-5 8H5M-5 56H5M-3 68H3" stroke="#c5a365" stroke-width="4"/>
              </g>
              <g id="kingHead">
                <path d="M-12-148q18-13 27 8l1 6 9 5-9 4q-2 11-16 10l-13-11Z" fill="#edcb9d"/>
                <path d="M-12-135q-9 2-8-7 1-6 8-4" fill="#dcb287"/>
                <path d="M-15-139l-1-10q4-13 16-13 13 0 17 14l-27 1v14Z" fill="#303e36"/>
                <path d="M6-139l9-3" fill="none" stroke-width="2"/><ellipse cx="12" cy="-135" rx="1.8" ry="2.2" fill="#344238" stroke="none"/>
                <path d="M6-126q5-5 10 0M-3-119l3 12 7-5 5-10" fill="#344238" stroke-width="1.4"/>
                <path d="M11-125l5 2" stroke="#fff0d0" stroke-width="2"/>
                <path d="M-15-153v-9h29v10Z" fill="#3b4c3f" stroke="#d0ad67" stroke-width="1.5"/>
                <path d="M-25-165l37-5 17 9-39 6Z" fill="#354539" stroke="#caa762" stroke-width="2"/>
                <g id="kingTassels" fill="#d9b774" stroke="#b5904f" stroke-width="1.1"><path d="M15-158v19M22-160v18M-21-163v15" fill="none"/><circle cx="15" cy="-152" r="1.8"/><circle cx="15" cy="-145" r="1.8"/><circle cx="15" cy="-139" r="2"/><circle cx="22" cy="-154" r="1.8"/><circle cx="22" cy="-148" r="1.8"/><circle cx="22" cy="-142" r="2"/><circle cx="-21" cy="-154" r="1.8"/><circle cx="-21" cy="-148" r="2"/></g>
                <path id="kingSweat" d="M31-150q-7 8-3 11 7 3 3-11Z" fill="#98b9b6" stroke="#6c9996" stroke-width="1"/>
              </g>
              <path id="kingFrontArm" d="M14-107Q30-84 45-93" fill="none" stroke="#bc5b42" stroke-width="18"/>
              <circle id="kingFrontHand" cx="45" cy="-93" r="6" fill="#edcb9d"/>
            </g></g>
          </g>
        </g>
        <!-- 名牌及对白保持正向，不随角色左右翻转 -->
        <g id="nameLabels" font-size="12" letter-spacing="2" text-anchor="middle" pointer-events="none"><g id="kingLabel"><rect x="-27" y="-11" width="54" height="21" rx="10.5" fill="#f4e9d9" opacity=".94"/><text y="4" fill="#984c37">秦王</text></g><g id="assassinLabel"><rect x="-27" y="-11" width="54" height="21" rx="10.5" fill="#e6eadb" opacity=".94"/><text y="4" fill="#596f59">荆轲</text></g></g>
        <g id="talkBubble" opacity="0" pointer-events="none"><path d="M-81-43H81q10 0 10 10v24Q91 1 81 1H8L-1 12-9 1H-81q-10 0-10-10v-24q0-10 10-10Z" fill="#fffbee" stroke="#c5bba1" stroke-width="1.4"/><text id="bubbleText" x="0" y="-16" text-anchor="middle" font-size="16" font-weight="500" fill="#685c42">剑怎么这么长！</text></g>
        <g opacity=".48" fill="#7c866e" font-size="11" letter-spacing="4"><text x="49" y="654">咸阳宫 · 殿前</text><text x="1151" y="654" text-anchor="end">绕柱有术，拔剑待定</text></g>
        <path d="M28 614v56h55M1172 614v56h-55" fill="none" stroke="#bcc2aa" stroke-width="1.3" opacity=".6"/>
      </svg>
    </div>
    <div class="controls">
      <div class="actions">
        <button class="btn primary" id="toggleBtn" type="button" aria-pressed="false" aria-label="暂停动画"><svg viewBox="0 0 20 20" aria-hidden="true"><path id="toggleIcon" d="M7 4v12M13 4v12" stroke-width="2.4"/></svg><span id="toggleText">暂停一下</span></button>
        <button class="btn" id="resetBtn" type="button" title="快捷键 R"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7a6.5 6.5 0 1 1-.3 5M4 3v4h4"/></svg>重新开跑</button>
        <button class="btn cheer" id="cheerBtn" type="button" title="让群臣提醒秦王试着拔剑"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h4l7-4v12l-7-4H3ZM7 12l1 5H5l-1-5M17 7q2 3 0 6"/></svg>王，负剑！</button>
      </div>
      <div class="speed"><label for="speedSlider">追逐速度</label><input id="speedSlider" type="range" min="0.5" max="2.5" step="0.25" value="1" aria-label="追逐速度" aria-valuetext="1 倍速"><output id="speedValue" for="speedSlider">1.00×</output></div>
    </div>
  </section>
  <footer><span><kbd>空格</kbd> 暂停 / 继续 &nbsp; <kbd>R</kbd> 重新开始 &nbsp; · &nbsp; 点击「王，负剑！」触发小彩蛋</span><span class="footer-note">趣味演绎，非史实复原 · 单文件 / 离线可用</span></footer>
  <noscript><p style="padding:16px;color:#ad4e39">动画需要启用 JavaScript。当前显示为静态 SVG 画面。</p></noscript>
</main>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const NS = 'http://www.w3.org/2000/svg';
  const TAU = Math.PI * 2;
  const OMEGA = 0.72;
  const CX = 600, CY = 486, RX = 280, RY = 77;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const state = { time: 0, speed: 1, paused: reducedMotion.matches, cheerAt: -Infinity, frame: 0, lastStamp: 0, lap: -1 };
  const rear = $('rearActors'), front = $('frontActors');
  const bubble = $('talkBubble'), bubbleText = $('bubbleText');
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const fmt = v => v.toFixed(2);
  const attr = (node, key, value) => node.setAttribute(key, String(value));
  let currentWords = '';

  function refs(name) {
    const r = { name, root: $(name), dust: [], position: null };
    for (const part of ['Facing','Bob','BackArm','BackHand','FrontArm','FrontHand','LegBack','LegFront','BootBack','BootFront','Skirt','Head','Shadow','Label']) r[part] = $(name + part);
    for (let i = 0; i < 11; i++) {
      const e = document.createElementNS(NS, 'ellipse');
      $('dustLayer').appendChild(e);
      r.dust.push(e);
    }
    return r;
  }
  const king = refs('king'), assassin = refs('assassin');
  const cape = $('kingCape'), capeTrim = $('kingCapeTrim'), ribbon = $('assassinRibbon');
  const sword = $('kingSword'), blade = $('kingBlade'), tassels = $('kingTassels');
  const sweat = $('kingSweat'), weapon = $('assassinWeapon'), glint = $('daggerGlint');
  const progress = $('lapProgress'), lapCount = $('lapCount');
  const crowdCheer = $('crowdCheer');

  function limb(node, hand, sx, sy, ex, ey, hx, hy) {
    attr(node, 'd', `M${sx} ${sy}Q${fmt(ex)} ${fmt(ey)} ${fmt(hx)} ${fmt(hy)}`);
    attr(hand, 'cx', fmt(hx));
    attr(hand, 'cy', fmt(hy));
  }

  function leg(actor, side, phase) {
    const hip = side === 'Front' ? 9 : -10;
    const x = hip + Math.sin(phase) * 25;
    const y = -5 - Math.max(0, Math.cos(phase)) * 17;
    const kx = (hip + x) / 2 + 13;
    const ky = (-47 + y) / 2 - 1;
    attr(actor['Leg' + side], 'd', `M${hip} -47Q${fmt(kx)} ${fmt(ky)} ${fmt(x)} ${fmt(y)}`);
    attr(actor['Boot' + side], 'transform', `translate(${fmt(x)} ${fmt(y)}) rotate(${fmt(Math.sin(phase) * 9)})`);
  }

  function place(actor, theta, phase, time) {
    const depth = Math.sin(theta);
    const x = CX + Math.cos(theta) * RX;
    const y = CY + depth * RY;
    const scale = (0.9 + depth * 0.11) * (actor === king ? 1.05 : 1);
    const facing = -Math.sin(theta) >= 0 ? 1 : -1;
    const squash = 0.86 + 0.14 * Math.abs(Math.sin(theta));
    const layer = depth < 0 ? rear : front;
    if (actor.root.parentNode !== layer) layer.appendChild(actor.root);
    attr(actor.root, 'transform', `translate(${fmt(x)} ${fmt(y)}) scale(${fmt(scale)})`);
    attr(actor.Facing, 'transform', `scale(${fmt(facing * squash)} 1)`);
    attr(actor.Bob, 'transform', `translate(0 ${fmt(-Math.abs(Math.sin(phase)) * 3.5)})`);
    attr(actor.Skirt, 'transform', `rotate(${fmt(Math.sin(phase) * 4)} 0 -78)`);
    attr(actor.Head, 'transform', `rotate(${fmt(Math.sin(phase + 0.3) * 2)} 0 -124)`);
    leg(actor, 'Back', phase + Math.PI);
    leg(actor, 'Front', phase);
    attr(actor.Shadow, 'cx', fmt(x));
    attr(actor.Shadow, 'cy', fmt(y + 2));
    attr(actor.Shadow, 'rx', fmt((29 - Math.abs(Math.sin(phase)) * 3) * scale));
    attr(actor.Shadow, 'ry', fmt(7.1 * scale));
    const visibility = depth < 0 ? clamp((Math.abs(x - CX) - 64) / 45, 0, 1) : 1;
    attr(actor.Label, 'transform', `translate(${fmt(x)} ${fmt(y + 24 * scale)})`);
    attr(actor.Label, 'opacity', fmt(visibility * 0.95));
    actor.position = { x, y, scale, facing, depth, visibility };
    actor.dust.forEach((e, i) => {
      const age = 0.13 + i * 0.075;
      const a = theta - age * OMEGA;
      const fade = (1 - i / actor.dust.length);
      const puff = 0.6 + 0.4 * Math.sin(time * 13 - i * 1.8);
      attr(e, 'cx', fmt(CX + Math.cos(a) * RX));
      attr(e, 'cy', fmt(CY + Math.sin(a) * RY + 3 - i * 0.5));
      attr(e, 'rx', fmt(2.5 + i * 0.48));
      attr(e, 'ry', fmt(1.3 + i * 0.21));
      attr(e, 'opacity', fmt(fade * puff * 0.23));
    });
  }

  function poseKing(phase, pull) {
    const s = Math.sin(phase), c = Math.cos(phase);
    limb(king.BackArm, king.BackHand, -13, -108, -27 - s * 6, -89, -29 - s * 18, -90 - c * 7);
    if (pull >= 0) {
      limb(king.FrontArm, king.FrontHand, 15, -108, 32, -105 - pull * 12, -16 + pull * 5, -102 - pull * 14);
    } else {
      limb(king.FrontArm, king.FrontHand, 15, -108, 25 + s * 6, -88, 32 + s * 18, -93 + c * 7);
    }
    const tailX = -83 - Math.sin(phase * 0.7) * 10;
    const tailY = -96 + Math.cos(phase * 0.9) * 8;
    attr(cape, 'd', `M-15-118C-42-112-52-91 ${fmt(tailX)} ${fmt(tailY)}Q-70-57-26-45L3-83Z`);
    attr(capeTrim, 'd', `M${fmt(tailX + 5)} ${fmt(tailY + 4)}Q-65-61-28-50`);
    attr(sword, 'transform', `translate(-26 -78) rotate(${fmt(24 + s * 3)})`);
    attr(blade, 'transform', `translate(0 ${fmt(pull >= 0 ? -pull * 16 : 0)})`);
    attr(tassels, 'transform', `rotate(${fmt(s * 8)} 5 -159)`);
    attr(sweat, 'opacity', fmt(0.55 + 0.4 * Math.sin(phase * 0.48)));
    attr(sweat, 'transform', `translate(0 ${fmt((1 + c) * 1.4)})`);
  }

  function poseAssassin(phase) {
    const s = Math.sin(phase), c = Math.cos(phase);
    limb(assassin.BackArm, assassin.BackHand, -13, -108, -30 - s * 8, -86, -32 - s * 19, -91 - c * 7);
    const hx = 48 + s * 7, hy = -98 + c * 6;
    limb(assassin.FrontArm, assassin.FrontHand, 15, -106, 33, -88 + s * 4, hx, hy);
    attr(weapon, 'transform', `translate(${fmt(hx)} ${fmt(hy)}) rotate(${fmt(-12 + s * 5)})`);
    attr(glint, 'opacity', fmt(Math.pow(Math.max(0, Math.sin(phase * 0.23)), 8)));
    attr(ribbon, 'd', `M-10-145Q-38-135-57 ${fmt(-151 + s * 7)}L-50 ${fmt(-142 + c * 5)}Q-33-127-12-139Z`);
  }

  function speak(actor, words, opacity) {
    if (!actor || opacity <= 0) { attr(bubble, 'opacity', 0); return; }
    const p = actor.position;
    const x = clamp(p.x + p.facing * 9, 105, 1095);
    const y = p.y - 177 * p.scale;
    attr(bubble, 'transform', `translate(${fmt(x)} ${fmt(y)})`);
    attr(bubble, 'opacity', fmt(opacity * p.visibility));
    if (words !== currentWords) { bubbleText.textContent = words; currentWords = words; }
  }

  function render() {
    const t = state.time;
    const theta = 0.92 + t * OMEGA;
    const gap = 1.03 + 0.12 * Math.sin(t * 0.67);
    const phase = t * 12;
    place(king, theta, phase, t);
    place(assassin, theta - gap, phase + 1.8, t);
    // 同一侧时，脚下位置更靠前的人最后绘制。
    if (king.root.parentNode === assassin.root.parentNode) {
      const layer = king.root.parentNode;
      const near = king.position.y > assassin.position.y ? king.root : assassin.root;
      if (layer.lastElementChild !== near) layer.appendChild(near);
    }
    const cheerTime = t - state.cheerAt;
    const cheering = cheerTime >= 0 && cheerTime < 2.7;
    const envelope = cheering ? Math.min(1, cheerTime * 5, (2.7 - cheerTime) * 4) : 0;
    const pull = cheering ? (0.25 + 0.75 * (0.5 - 0.5 * Math.cos(cheerTime * 13))) * envelope : -1;
    poseKing(phase, pull);
    poseAssassin(phase + 1.8);
    attr(crowdCheer, 'opacity', fmt(envelope));
    if (cheering) {
      speak(king, cheerTime < 1.4 ? '等一下，剑卡住了！' : '先绕一圈再说！', envelope);
    } else {
      const beat = t % 12;
      if (beat < 3.1) speak(king, '剑怎么这么长！', Math.min(1, beat * 4, (3.1 - beat) * 4));
      else if (beat > 4.4 && beat < 7.3) speak(assassin, '你倒是停一下！', Math.min(1, (beat - 4.4) * 4, (7.3 - beat) * 4));
      else if (beat > 9 && beat < 11.5) speak(king, '这柱子，甚好。', Math.min(1, (beat - 9) * 4, (11.5 - beat) * 4));
      else speak(null, '', 0);
    }
    const completed = t * OMEGA / TAU;
    const lap = Math.floor(completed) + 1;
    if (state.lap !== lap) { state.lap = lap; lapCount.textContent = String(lap).padStart(2, '0'); }
    const circumference = 2 * Math.PI * 14;
    attr(progress, 'stroke-dasharray', `${fmt((completed % 1) * circumference)} ${fmt(circumference)}`);
  }

  function tick(stamp) {
    state.frame = 0;
    if (state.paused || document.hidden) { state.lastStamp = 0; return; }
    if (state.lastStamp) state.time += Math.min((stamp - state.lastStamp) / 1000, 0.06) * state.speed;
    state.lastStamp = stamp;
    render();
    state.frame = requestAnimationFrame(tick);
  }

  function schedule() {
    if (!state.frame && !state.paused && !document.hidden) state.frame = requestAnimationFrame(tick);
  }

  function setPaused(paused) {
    state.paused = paused;
    if (state.frame) cancelAnimationFrame(state.frame);
    state.frame = 0;
    state.lastStamp = 0;
    $('toggleText').textContent = paused ? '继续开跑' : '暂停一下';
    $('toggleBtn').setAttribute('aria-label', paused ? '继续动画' : '暂停动画');
    $('toggleBtn').setAttribute('aria-pressed', String(paused));
    attr($('toggleIcon'), 'd', paused ? 'M6 3l10 7-10 7Z' : 'M7 4v12M13 4v12');
    attr($('toggleIcon'), 'fill', paused ? 'currentColor' : 'none');
    $('statusText').textContent = paused ? '歇口气，稍后再绕' : '追逐进行中';
    $('live').classList.toggle('is-paused', paused);
    render();
    schedule();
  }

  function reset() {
    state.time = 0;
    state.cheerAt = -Infinity;
    state.lastStamp = 0;
    state.lap = -1;
    render();
  }

  $('toggleBtn').addEventListener('click', () => setPaused(!state.paused));
  $('resetBtn').addEventListener('click', reset);
  $('cheerBtn').addEventListener('click', () => {
    state.cheerAt = state.time;
    if (state.paused) setPaused(false);
    else render();
  });
  $('speedSlider').addEventListener('input', e => {
    const n = Number(e.target.value);
    state.speed = Number.isFinite(n) ? clamp(n, 0.5, 2.5) : 1;
    $('speedValue').textContent = state.speed.toFixed(2) + '×';
    $('speedSlider').setAttribute('aria-valuetext', state.speed + ' 倍速');
  });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (e.target.closest('input,button,textarea,select,[contenteditable="true"]')) return;
    if (e.code === 'Space') { e.preventDefault(); setPaused(!state.paused); }
    if (e.code === 'KeyR') { e.preventDefault(); reset(); }
  });
  document.addEventListener('visibilitychange', () => {
    state.lastStamp = 0;
    if (document.hidden && state.frame) { cancelAnimationFrame(state.frame); state.frame = 0; }
    else schedule();
  });
  const onMotionChange = e => { if (e.matches) setPaused(true); };
  if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', onMotionChange);
  setPaused(state.paused);
})();
</script>
