    stars.forEach(o=>opacity(o.node,.40+.45*(.5+.5*Math.sin(t*.85+o.phase))));
    ripples.forEach(o=>{const dx=Math.sin(t*1.1+o.phase)*12;attr(o.node,'transform',`translate(${dx} 0) scale(1 1)`);opacity(o.node,.18+Math.sin(t*.8+o.phase)**2*.48);});
    hearts.forEach(o=>{const progress=(t*.17+o.phase)%1;attr(o.node,'transform',`translate(${720+o.offset+Math.sin(t+o.phase*7)*13} ${440-progress*220}) scale(${.23+progress*.23})`);opacity(o.node,(Math.sin(progress*Math.PI)**2)*Math.max(vow*.55,dream*.58));});
    el.narration.style.opacity=(ramp(.05,.7,local)*(1-ramp(9.4,10,local))).toFixed(3);
    el.seek.value=t.toFixed(2);el.elapsed.textContent=fmt(t);
    el.seek.setAttribute('aria-valuetext',`${Math.floor(t)}秒，共60秒；${story[index].title}`);
    chapterButtons[index].style.setProperty('--chapter-progress',`${local*10}%`);
  }
  function seekTo(value) {time=clamp(Number(value)||0,0,DURATION-.001);lastStamp=null;render(time);}
  function toggle(){setPlaying(!playing);}
  el.play.addEventListener('click',toggle);
  el.stage.addEventListener('click',event=>{if(!event.target.closest('button'))toggle();});
  $('restart').addEventListener('click',()=>{seekTo(0);setPlaying(true);});
  el.seek.addEventListener('input',event=>seekTo(event.target.value));
  el.speed.addEventListener('change',event=>{rate=Number(event.target.value)||1;lastStamp=null;});
  chapterButtons.forEach(button=>button.addEventListener('click',()=>{seekTo(Number(button.dataset.scene)*10+1.3);}));
  document.addEventListener('keydown',event=>{
    if(event.ctrlKey||event.altKey||event.metaKey) return;
    const tag=document.activeElement?.tagName;
    if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(tag))return;
    if(event.code==='Space'){event.preventDefault();toggle();}
    else if(event.code==='ArrowLeft'){event.preventDefault();seekTo(time-5);}
    else if(event.code==='ArrowRight'){event.preventDefault();seekTo(time+5);}
    else if(event.code==='Home'){event.preventDefault();seekTo(0);}
  });
  let toastTimer;
  function toast(message){const node=$('toast');node.textContent=message;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2800);}
  $('fullscreen').addEventListener('click',async event=>{
    event.stopPropagation();
    try{
      if(document.fullscreenElement){await document.exitFullscreen();}
      else if(el.player.requestFullscreen){await el.player.requestFullscreen();}
      else{toast('此浏览器不支持页面全屏，可使用浏览器全屏模式。');}
    }catch(error){toast('未能进入全屏，请使用浏览器的全屏功能。');}
  });
  document.addEventListener('visibilitychange',()=>{lastStamp=null;});
  function tick(stamp){
    if(lastStamp===null)lastStamp=stamp;
    const dt=Math.min((stamp-lastStamp)/1000,.1);lastStamp=stamp;
    if(playing&&!document.hidden){time=(time+dt*rate)%DURATION;render(time);}
    requestAnimationFrame(tick);
  }
  setPlaying(playing);render(time);requestAnimationFrame(tick);
})();
</script>
</body>
</html>
